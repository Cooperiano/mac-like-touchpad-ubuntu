name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Select the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build the pinned drag engine
        env:
          UPSTREAM_COMMIT: ae22defe47156e13476f08dce6cd98e5aaa49227
        run: |
          git clone https://github.com/lmr97/linux-3-finger-drag.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          export CARGO_INCREMENTAL=0 TZ=UTC LANG=C.UTF-8
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/workspace"
          cargo test --manifest-path upstream/Cargo.toml --locked
          cargo build --manifest-path upstream/Cargo.toml --release --locked
          mkdir -p dist
          install -m 0755 upstream/target/release/linux-3-finger-drag dist/linux-3-finger-drag-x86_64
          sha256sum dist/linux-3-finger-drag-x86_64 | tee dist/SHA256SUMS
      - name: Require installer checksum to match the release asset
        run: |
          expected="$(sed -n 's/^readonly DRAG_SHA256="\([0-9a-f]*\)"$/\1/p' install.sh)"
          actual="$(cut -d' ' -f1 dist/SHA256SUMS)"
          test "$expected" = "$actual"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/linux-3-finger-drag-x86_64 \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
